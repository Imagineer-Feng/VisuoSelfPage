name: Deploy VisuoSelf to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate the static website
        id: site
        shell: bash
        run: |
          if [ -f website/index.html ]; then
            echo "directory=website" >> "$GITHUB_OUTPUT"
          elif [ -f index.html ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          else
            echo "Cannot find website/index.html or index.html" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.directory }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
